<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Herna</title>
  <meta name="description" content="Sbírka rychlých her do kapsy. Funguje offline, bez účtu a bez reklam.">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Herna">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top"></header>
    <main id="view" class="view"></main>
    <nav id="nav" aria-label="Hlavní navigace"></nav>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">Herna potřebuje zapnutý JavaScript.</p></noscript>
  <script src="js/core.js"></script>
  <script src="js/games/piskvorky.js"></script>
  <script src="js/games/ctyri.js"></script>
  <script src="js/games/zavod.js"></script>
  <script src="js/games/miny.js"></script>
  <script src="js/games/pexeso.js"></script>
  <script src="js/games/g2048.js"></script>
  <script src="js/games/had.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/slovo.js"></script>
  <script src="js/games/lode.js"></script>
  <script src="js/games/dama.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/city.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW:', err));
      });
    }
  </script>
</body>
</html>
